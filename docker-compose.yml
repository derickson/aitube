services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3103:8000"
    env_file:
      - .env
    environment:
      - CONTENT_DLP_URL=http://host.docker.internal:7055
      # Hermes summarization offload. The `hermes` ssh alias from ~/.ssh/config is not
      # available in-container, so target the host explicitly with a mounted key.
      - HERMES_ENABLED=${HERMES_ENABLED:-false}
      - HERMES_SSH_TARGET=${HERMES_SSH_TARGET:-root@187.77.195.232}
      - HERMES_SSH_OPTS=-i /run/secrets/hermes_key -o UserKnownHostsFile=/run/secrets/hermes_known_hosts
      - HERMES_MODEL=${HERMES_MODEL:-gpt-5.4-mini}
      - HERMES_PROFILE=${HERMES_PROFILE:-aitube}
    volumes:
      - ~/.ssh/hermes_ed25519:/run/secrets/hermes_key:ro
      - ~/.ssh/hermes_known_hosts:/run/secrets/hermes_known_hosts:ro
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # RUM is opt-in and defaults to off (browser intake currently fails in prod).
        # Backend Python APM is unaffected — it uses the separate ELASTIC_APM_* vars.
        - VITE_ELASTIC_APM_RUM_ENABLED=${VITE_ELASTIC_APM_RUM_ENABLED:-false}
        - VITE_ELASTIC_APM_SERVER_URL=${VITE_ELASTIC_APM_SERVER_URL:-}
        - VITE_ELASTIC_APM_ENVIRONMENT=${VITE_ELASTIC_APM_ENVIRONMENT:-development}
    ports:
      - "8103:80"
    depends_on:
      - backend
    restart: unless-stopped
