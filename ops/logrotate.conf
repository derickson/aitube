# User-level logrotate for the cron jobs' shared log (poll_feeds, rebuild_clusters).
# Run from dave's crontab (no root needed):
#   45 3 * * * /usr/sbin/logrotate -s /home/dave/.local/state/aitube-logrotate.status /home/dave/dev/aitube/ops/logrotate.conf
# copytruncate is safe because the cron entries append with `>>` (O_APPEND).
/home/dave/dev/aitube/cron.log {
    size 20M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
